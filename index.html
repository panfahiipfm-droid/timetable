<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางเรียนของฉัน</title>
<meta name="description" content="ตารางเรียนรายสัปดาห์ที่เพิ่ม แก้ไข คัดลอกวิชาข้ามวัน และดาวน์โหลดเป็นรูปภาพได้">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; }
/* Layout: two tabs. Mine = weekday rows over an hour ruler. Friends = person chips, a shared free-time strip per day, then one person's grid. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #1c2530;
  --muted: #66727f;
  --line: #dde2e8;
  --accent: #1f5f8b;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --warn-bg: #fff1d6;
  --warn-fg: #7a4b00;
  --free: #cfe8d5;
  --busy: #d9604f;
  --c1-bg: #d6e8f7; --c1-fg: #123d5c;
  --c2-bg: #dcefd9; --c2-fg: #1f4a1b;
  --c3-bg: #fbe3d0; --c3-fg: #6b3210;
  --c4-bg: #ecdcf4; --c4-fg: #46225c;
  --c5-bg: #fbf0b8; --c5-fg: #5a4a00;
  --c6-bg: #f8d6dc; --c6-fg: #6a1a2a;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1a2129; --fg: #e6ebf0; --muted: #94a0ac; --line: #2c3641;
    --accent: #6fb4e6; --accent-fg: #0d1a25; --danger: #ff8a80;
    --warn-bg: #3d3010; --warn-fg: #f5cf80;
    --free: #25472c; --busy: #e8806f;
    --c1-bg: #1e3b52; --c1-fg: #bfe0f8;
    --c2-bg: #213d20; --c2-fg: #c6e8c2;
    --c3-bg: #4a2f1d; --c3-fg: #f7d3b8;
    --c4-bg: #3a2848; --c4-fg: #e3cdf2;
    --c5-bg: #453d12; --c5-fg: #f3e7a0;
    --c6-bg: #4a2229; --c6-fg: #f6c6cf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a2129; --fg: #e6ebf0; --muted: #94a0ac; --line: #2c3641;
  --accent: #6fb4e6; --accent-fg: #0d1a25; --danger: #ff8a80;
  --warn-bg: #3d3010; --warn-fg: #f5cf80;
  --free: #25472c; --busy: #e8806f;
  --c1-bg: #1e3b52; --c1-fg: #bfe0f8;
  --c2-bg: #213d20; --c2-fg: #c6e8c2;
  --c3-bg: #4a2f1d; --c3-fg: #f7d3b8;
  --c4-bg: #3a2848; --c4-fg: #e3cdf2;
  --c5-bg: #453d12; --c5-fg: #f3e7a0;
  --c6-bg: #4a2229; --c6-fg: #f6c6cf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 24px 40px; }
.wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-size: 1.75rem; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.9rem; max-width: 62ch; }
.stats { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.stats b { color: var(--fg); font-weight: 500; }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--bg); border-color: var(--danger); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.toolbar .spacer { flex: 1 1 0; }
.opt { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--muted); }
.opt select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
.note { background: var(--warn-bg); color: var(--warn-fg); padding: 8px 12px; border-radius: 6px; font-size: 0.88rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel h2 { font-size: 1.05rem; margin: 0 0 12px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.02em; }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; min-height: 40px; width: 100%; }
.field.wide { grid-column: 1 / -1; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--surface) inset; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.err { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }
.scroller { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.panel .scroller { border-radius: 6px; }
.tt { min-width: 760px; }
.row { display: grid; grid-template-columns: 72px 1fr; border-top: 1px solid var(--line); }
.row.head { border-top: 0; background: var(--bg); }
.dayname { padding: 12px 8px 12px 14px; font-weight: 600; border-right: 1px solid var(--line); position: sticky; left: 0; background: var(--surface); z-index: 2; }
.row.head .dayname { background: var(--bg); }
.hours { position: relative; height: 34px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.hours span { position: absolute; top: 8px; transform: translateX(-50%); }
.hours span:first-child { transform: translateX(4px); }
.hours span:last-child { transform: translateX(calc(-100% - 4px)); }
.lanes { position: relative; cursor: cell; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / var(--hours)) 100%; }
.ro .lanes { cursor: default; }
.blk { position: absolute; border: 0; border-radius: 4px; padding: 8px 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; line-height: 1.5; }
.ro .blk { cursor: default; }
.blk:hover { filter: brightness(0.96); }
.blk .t { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
.blk .m { font-size: 0.82rem; overflow-wrap: anywhere; }
.blk .tm { font-family: var(--mono); font-size: 0.78rem; margin-top: auto; }
.blk.clash { outline: 2px dashed var(--danger); outline-offset: -2px; }
.daychecks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.field .chk { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; color: var(--fg); letter-spacing: 0; cursor: pointer; }
.field .chk input { width: 18px; height: 18px; min-height: 0; padding: 0; }
.dayrow { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.dayrow select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; min-height: 40px; }
.chk2 { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.chk2 input { width: 18px; height: 18px; }
.msg { color: var(--muted); font-size: 0.88rem; min-height: 1.3em; margin-top: 8px; }
.tpick { display: flex; align-items: center; gap: 6px; }
.field .tpick select { width: auto; flex: 1; min-width: 0; }
.durs { display: flex; flex-wrap: wrap; gap: 8px; }
.dur { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 12px; min-height: 40px; cursor: pointer; }
.dur:hover { border-color: var(--accent); }
.dur[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.empty { padding: 20px; text-align: center; color: var(--muted); }
.hint { color: var(--muted); font-size: 0.85rem; }
.copybox, .codebox { width: 100%; min-height: 110px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 0.8rem; color: var(--fg); resize: vertical; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: border-color .15s, background .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>ตารางเรียนของฉัน</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="hint" id="saveStat" role="status"></div>

  <section class="stack" id="paneMine">
    <div class="toolbar">
      <button class="btn primary" id="addBtn" type="button">+ เพิ่มวิชา</button>
      <button class="btn" id="dayCopyBtn" type="button">คัดลอกทั้งวัน</button>
      <label class="opt" for="startH">เริ่ม
        <select id="startH"></select>
      </label>
      <label class="opt" for="endH">ถึง
        <select id="endH"></select>
      </label>
      <label class="opt" for="weekend"><input type="checkbox" id="weekend"> แสดงเสาร์–อาทิตย์</label>
      <span class="spacer"></span>
      <button class="btn" id="imgBtn" type="button">ดาวน์โหลดเป็นรูปภาพ</button>
      <button class="btn" id="copyBtn" type="button">คัดลอกเป็นข้อความ</button>
      <button class="btn danger" id="clearBtn" type="button">ล้างทั้งหมด</button>
    </div>

    <div class="note" id="clashNote" hidden></div>

    <section class="panel" id="dayPanel" hidden aria-labelledby="dayTitle">
      <h2 id="dayTitle">คัดลอกวิชาทั้งวัน</h2>
      <div class="dayrow">
        <label for="dcFrom">คัดลอกจาก <select id="dcFrom"></select></label>
        <span>ไปยัง</span>
        <div class="daychecks" id="dcTo" role="group" aria-label="วันปลายทาง"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="dcGo" type="button">คัดลอก</button>
        <button class="btn" id="dcPresetA" type="button">จันทร์ → พฤหัสฯ</button>
        <button class="btn" id="dcPresetB" type="button">อังคาร → ศุกร์</button>
        <button class="btn" id="dcClose" type="button">ปิด</button>
      </div>
      <div class="msg" id="dcMsg" role="status"></div>
    </section>

    <section class="panel" id="formPanel" hidden aria-labelledby="formTitle">
      <h2 id="formTitle">เพิ่มวิชา</h2>
      <form id="form" class="form" novalidate>
        <div class="field wide"><label for="fName">ชื่อวิชา</label><input id="fName" type="text" autocomplete="off" placeholder="เช่น แคลคูลัส 1"></div>
        <div class="field"><label for="fCode">รหัสวิชา (ไม่บังคับ)</label><input id="fCode" type="text" autocomplete="off"></div>
        <div class="field"><label for="fRoom">ห้องเรียน (ไม่บังคับ)</label><input id="fRoom" type="text" autocomplete="off"></div>
        <div class="field"><label for="fTeacher">อาจารย์ (ไม่บังคับ)</label><input id="fTeacher" type="text" autocomplete="off"></div>
        <div class="field"><label for="fDay">วัน</label><select id="fDay"></select></div>
        <div class="field"><label id="stLbl">เวลาเริ่ม</label><div class="tpick" role="group" aria-labelledby="stLbl"><select id="fStartH" aria-label="ชั่วโมงที่เริ่ม"></select><span aria-hidden="true">:</span><select id="fStartM" aria-label="นาทีที่เริ่ม"></select></div></div>
        <div class="field"><label id="enLbl">เวลาเลิก</label><div class="tpick" role="group" aria-labelledby="enLbl"><select id="fEndH" aria-label="ชั่วโมงที่เลิก"></select><span aria-hidden="true">:</span><select id="fEndM" aria-label="นาทีที่เลิก"></select></div></div>
        <div class="field wide"><label id="durLbl">เรียนนานเท่าไร (แตะเพื่อตั้งเวลาเลิกให้อัตโนมัติ)</label><div class="durs" id="durs" role="group" aria-labelledby="durLbl"></div></div>
        <div class="field wide"><label id="colorLbl">สี</label><div class="swatches" id="swatches" role="group" aria-labelledby="colorLbl"></div></div>
        <div class="field wide"><label id="alsoLbl">เรียนวันอื่นด้วย (ติ๊กเพื่อคัดลอกวิชานี้ไปวันเหล่านั้น)</label><div class="daychecks" id="alsoDays" role="group" aria-labelledby="alsoLbl"></div></div>
      </form>
      <div class="err" id="err" role="alert"></div>
      <div class="actions">
        <button class="btn primary" id="saveBtn" type="button">บันทึก</button>
        <button class="btn" id="cancelBtn" type="button">ยกเลิก</button>
        <button class="btn danger" id="delBtn" type="button" hidden>ลบวิชานี้</button>
      </div>
    </section>

    <div class="scroller"><div class="tt" id="tt"></div></div>

    <section class="panel" id="copyPanel" hidden>
      <h2 id="copyTitle">ข้อความตารางเรียน</h2>
      <textarea class="copybox" id="copyText" readonly></textarea>
      <p class="hint" id="copyHint">เลือกข้อความด้านบนเพื่อคัดลอก</p>
    </section>
  </section>

</div>

<script>
(function () {
  var DAYS = [
    { k: 1, n: 'จันทร์' }, { k: 2, n: 'อังคาร' }, { k: 3, n: 'พุธ' }, { k: 4, n: 'พฤหัสฯ' },
    { k: 5, n: 'ศุกร์' }, { k: 6, n: 'เสาร์' }, { k: 7, n: 'อาทิตย์' }
  ];
  var COLORS = 6;
  var KEY = 'timetable-v1';
  var SAMPLE = [
    { name: 'การเขียนโปรแกรมเบื้องต้น', code: '01418112', room: 'SC 2-301', teacher: 'อ.สมชาย', day: 1, s: 540, e: 720, c: 1 },
    { name: 'แคลคูลัส 1', code: '01417111', room: 'LH 4-102', teacher: 'อ.วิภา', day: 2, s: 780, e: 960, c: 2 },
    { name: 'ภาษาอังกฤษเพื่อการสื่อสาร', code: '01355101', room: 'HM 5-204', teacher: 'อ.Emily', day: 3, s: 540, e: 660, c: 3 },
    { name: 'ฟิสิกส์ทั่วไป', code: '01420111', room: 'SC 1-105', teacher: 'อ.ธนา', day: 4, s: 600, e: 720, c: 4 },
    { name: 'ปฏิบัติการฟิสิกส์', code: '01420112', room: 'Lab 3', teacher: 'อ.ธนา', day: 4, s: 780, e: 960, c: 5 },
    { name: 'พลศึกษา', code: '01175101', room: 'สนามกีฬา', teacher: '', day: 5, s: 480, e: 600, c: 6 }
  ];

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function parse(v) { if (!v) return null; var a = v.split(':'); return parseInt(a[0], 10) * 60 + parseInt(a[1], 10); }
  function dayName(k) { return DAYS.filter(function (d) { return d.k === k; })[0].n; }
  function dur(m) { var h = Math.floor(m / 60), r = m % 60; return ((h ? h + ' ชม.' : '') + (r ? ' ' + r + ' นาที' : '')).trim(); }

  // ---- clean anything that comes from storage, the shared store, or a pasted code ----
  function num(v, lo, hi, d) { var n = Math.round(Number(v)); return isFinite(n) && n >= lo && n <= hi ? n : d; }
  function str(v, n) { return typeof v === 'string' ? v.slice(0, n) : ''; }
  function cleanClass(c) {
    if (!c || typeof c !== 'object') return null;
    var s = num(c.s, 0, 1439, -1), e = num(c.e, 1, 1440, -1), d = num(c.day, 1, 7, 0);
    var name = str(c.name, 80).trim();
    if (s < 0 || e < 0 || e <= s || !d || !name) return null;
    return { name: name, code: str(c.code, 30), room: str(c.room, 40), teacher: str(c.teacher, 40), day: d, s: s, e: e, c: num(c.c, 1, COLORS, 1) };
  }
  function cleanList(arr, max) {
    var out = [];
    if (Array.isArray(arr)) arr.forEach(function (x) {
      if (out.length >= (max || 300)) return;
      var k = cleanClass(x);
      if (k) { k.id = out.length + 1; out.push(k); }
    });
    return out;
  }
  function looksSample(list) {
    return list.length === SAMPLE.length && SAMPLE.every(function (s, i) { return list[i] && list[i].name === s.name && list[i].day === s.day && list[i].s === s.s; });
  }
  function norm(raw) {
    raw = raw && typeof raw === 'object' ? raw : {};
    var list = cleanList(raw.classes, 300);
    return {
      classes: list,
      startH: num(raw.startH, 6, 12, 8), endH: num(raw.endH, 13, 22, 17),
      weekend: !!raw.weekend, nextId: Math.max(100, list.length + 1),
      isSample: typeof raw.isSample === 'boolean' ? raw.isSample : looksSample(list)
    };
  }

  var state = norm({ classes: SAMPLE, isSample: true });
  var loadedLocal = false;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && Array.isArray(p.classes)) { state = norm(p); loadedLocal = true; } }
  } catch (e) {}

  var editingId = null, pickedColor = 1, delArmed = false, clearArmed = false;

  function setStatus(t) { $('saveStat').textContent = t; }
  function touch() { state.isSample = false; }

  // ---- saving: this browser only ----
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---- layout helpers ----
  function layout(list) {
    var sorted = list.map(function (c) { return Object.assign({}, c); }).sort(function (a, b) { return a.s - b.s || a.e - b.e; });
    var laneEnds = [], clash = {};
    sorted.forEach(function (c) {
      var lane = 0;
      while (lane < laneEnds.length && laneEnds[lane] > c.s) lane++;
      laneEnds[lane] = c.e; c.lane = lane;
      if (lane > 0) clash[c.id] = true;
    });
    sorted.forEach(function (a) {
      sorted.forEach(function (b) { if (a !== b && a.s < b.e && b.s < a.e) { clash[a.id] = true; clash[b.id] = true; } });
    });
    return { items: sorted, lanes: Math.max(1, laneEnds.length), clash: clash };
  }
  function visibleDays() { return DAYS.filter(function (d) { return state.weekend || d.k <= 5; }); }

  function gridHTML(classes, o) {
    var hours = o.endH - o.startH, span = hours * 60;
    var html = '<div class="row head"><div class="dayname">วัน</div><div class="hours" style="--hours:' + hours + '">';
    for (var h = o.startH; h <= o.endH; h++) html += '<span style="left:' + ((h - o.startH) / hours * 100) + '%">' + pad(h) + ':00</span>';
    html += '</div></div>';
    var clash = 0, outside = 0;
    o.days.forEach(function (d) {
      var L = layout(classes.filter(function (c) { return c.day === d.k; }));
      html += '<div class="row"><div class="dayname">' + d.n + '</div><div class="lanes" data-day="' + d.k + '" style="--hours:' + hours + ';height:56px">';
      L.items.forEach(function (c) {
        var s = Math.max(c.s, o.startH * 60), e = Math.min(c.e, o.endH * 60);
        if (e <= s) { outside++; return; }
        var left = (s - o.startH * 60) / span * 100, width = (e - s) / span * 100;
        var cl = L.clash[c.id] ? ' clash' : '';
        var meta = [c.code, c.room].filter(Boolean).join(' · ');
        html += '<button type="button" class="blk' + cl + '" data-id="' + c.id + '" data-lane="' + c.lane + '" style="left:' + left + '%;width:calc(' + width + '% - 2px);top:0;background:var(--c' + c.c + '-bg);color:var(--c' + c.c + '-fg)">'
          + '<span class="t">' + esc(c.name) + '</span>'

    $('copyTitle').textContent = title;
    $('copyText').value = text; $('copyPanel').hidden = false;
    $('copyText').focus(); $('copyText').select();
    var hint = $('copyHint');
    hint.textContent = 'เลือกข้อความด้านบนแล้ว กดคัดลอกที่เครื่องของคุณ';
    try {
      navigator.clipboard.writeText(text).then(function () { hint.textContent = doneMsg; }, function () {});
    } catch (err) {}
  }
  $('copyBtn').addEventListener('click', function () {
    var lines = [];
    DAYS.forEach(function (d) {
      var list = state.classes.filter(function (c) { return c.day === d.k; }).sort(function (a, b) { return a.s - b.s; });
      if (!list.length) return;
      lines.push(d.n);
      list.forEach(function (c) {
        lines.push('  ' + fmt(c.s) + '–' + fmt(c.e) + '  ' + c.name + (c.code ? ' (' + c.code + ')' : '') + (c.room ? ' ห้อง ' + c.room : '') + (c.teacher ? ' · ' + c.teacher : ''));
      });
    });
    showCopy('ข้อความตารางเรียน', lines.join('\n') || 'ยังไม่มีวิชา', 'คัดลอกแล้ว');
  });

  render(true);
  setStatus('ตารางเก็บไว้ในเบราว์เซอร์เครื่องนี้ ถ้าล้างข้อมูลเบราว์เซอร์หรือเปลี่ยนเครื่อง ตารางจะหาย');
})();
</script>
</body>
</html>
